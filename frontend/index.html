<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CarBUS for Mac</title>
    <script>
      // Оформление до загрузки приложения: последняя тема с сервера из кэша браузера
      // (пишет core/theme.ts), без кэша — как в ОС. Иначе до ответа сервера мелькает
      // светлая тема. Формулы шрифта и высоты строки — как в applyTheme.
      (function () {
        var d = document.documentElement;
        var s = {};
        try {
          s = JSON.parse(localStorage.getItem("carbus:theme") || "{}") || {};
        } catch (e) {}
        var dark = false;
        try {
          dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        } catch (e) {}
        d.setAttribute("data-theme", s.theme === "light" || s.theme === "dark" ? s.theme : dark ? "dark" : "light");
        var size = s.grid_font_size;
        if (typeof size === "number" && size >= 6 && size <= 48) {
          d.style.setProperty("--grid-size", size + "px");
          d.style.setProperty("--row-h", Math.round(size * 1.7) + "px");
        }
        if (typeof s.grid_font === "string" && s.grid_font) {
          d.style.setProperty("--grid-font", '"' + s.grid_font + '", "SF Mono", Menlo, Monaco, monospace');
        }
      })();
    </script>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%232f6fd6'/%3E%3Ctext x='8' y='12' font-size='10' text-anchor='middle' fill='white' font-family='Arial'%3EC%3C/text%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
