services:
  backend:
    image: ghcr.io/scryptor/carbusmac:latest   # готовый образ с GitHub (.github/workflows/docker.yml)
    build: .                                   # `docker compose up --build` — собрать из исходников
    ports:
      - "127.0.0.1:8000:8000"          # UI и WS только на localhost мака
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - CARBUS_BRIDGE=host.docker.internal:7000   # нативный мост на маке
      - CARBUS_HOST_DIR=${PWD:-}                  # папка проекта: интерфейс покажет команду запуска моста
    volumes:
      - ./traces:/app/traces           # трейсы остаются на маке
      - ./data:/app/data               # настройки, списки передачи, фильтры, комментарии
    restart: unless-stopped
